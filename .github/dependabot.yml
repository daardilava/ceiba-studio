version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      next-react:
        patterns:
          ['next', 'react', 'react-dom', '@types/react', '@types/react-dom', 'eslint-config-next']
      tooling:
        patterns:
          [
            'eslint*',
            '@eslint/*',
            'typescript',
            'vitest',
            'husky',
            'lint-staged',
            '@commitlint/*',
            'tailwindcss',
            '@tailwindcss/*',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
